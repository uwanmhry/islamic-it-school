<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-r from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl flex flex-col md:flex-row w-full max-w-4xl">
        <div class="bg-blue-900 text-white rounded-t-2xl md:rounded-l-2xl md:rounded-tr-none md:w-2/5 p-5 flex flex-col justify-center items-center">
            <div class="text-center">
                <h2 class="text-3xl font-bold mb-2">Admin Portal</h2>
                <div class="border-2 w-10 border-white inline-block mb-2"></div>
                <p class="mb-6">Masuk ke dashboard admin Anda</p>
                <a href="#" class="border-2 border-white rounded-full px-12 py-2 inline-block font-semibold hover:bg-white hover:text-blue-900">Info Lebih Lanjut</a>
            </div>
        </div>
        
        <div class="p-5 md:w-3/5">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-blue-900">Selamat Datang</h2>
                <div class="border-2 w-10 border-blue-900 inline-block mb-2"></div>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-400">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email" class="pl-10 w-full p-2 border-b-2 border-gray-300 focus:outline-none focus:border-blue-900" required>
                </div>
                
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" placeholder="Password" class="pl-10 w-full p-2 border-b-2 border-gray-300 focus:outline-none focus:border-blue-900" required>
                    <span class="absolute right-3 top-3 text-gray-400 cursor-pointer" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
                
                <div class="flex justify-between items-center mt-6">
                    <label class="flex items-center text-sm text-gray-600">
                        <input type="checkbox" class="form-checkbox">
                        <span class="ml-2">Ingat saya</span>
                    </label>
                    <a href="#" class="text-sm text-blue-900 hover:underline">Lupa Password?</a>
                </div>
                
                <div class="mt-8">
                    <button type="submit" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white w-full py-3 rounded-full font-bold hover:from-blue-600 hover:to-purple-700 transition-all duration-300">
                        <span id="loginText">Masuk</span>
                        <div id="loginSpinner" class="hidden justify-center">
                            <div class="w-6 h-6 border-t-2 border-r-2 border-white rounded-full animate-spin"></div>
                        </div>
                    </button>
                </div>
            </form>
            
            <div id="loginMessage" class="mt-4 text-center hidden"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
